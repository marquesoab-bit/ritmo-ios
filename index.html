<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ritmo</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ritmo">
<meta name="theme-color" content="#EEF1EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1614" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de uma tela (iPhone 13, 390x844): conteúdo rolável + barra de abas fixa; cronômetro flutuante por cima de tudo; edição e compras abrem como folha cheia. */
:root{
  --bg:#EEF1EE; --surface:#FFFFFF; --ink:#12201D; --muted:#5E6F6B; --line:#D8DFDB;
  --accent:#0C7A68; --accent-ink:#FFFFFF; --accent-soft:#D5ECE6; --amber:#9A5C00; --amber-soft:#F6E5C6;
  --danger:#B3362B; --danger-soft:#F6D9D5; --water:#2B7FB8; --water-soft:#D6E8F5;
  --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Figtree',-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1614; --surface:#18221F; --ink:#E8F0EC; --muted:#8FA39D; --line:#27332F;
  --accent:#3FD1B4; --accent-ink:#06211B; --accent-soft:#16342D; --amber:#F0B34A; --amber-soft:#3A2D12; --danger:#FF8A7A; --danger-soft:#43211D;
  --water:#6CB8EA; --water-soft:#17303F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1614; --surface:#18221F; --ink:#E8F0EC; --muted:#8FA39D; --line:#27332F;
  --accent:#3FD1B4; --accent-ink:#06211B; --accent-soft:#16342D; --amber:#F0B34A; --amber-soft:#3A2D12; --danger:#FF8A7A; --danger-soft:#43211D;
  --water:#6CB8EA; --water-soft:#17303F; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden;
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible,.ex-top:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 0 24px;min-height:0;-webkit-overflow-scrolling:touch}
#app.timer-on main{padding-bottom:110px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance}
h1{font-size:34px;line-height:1}
h2{font-size:24px;line-height:1.05}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.small{min-height:40px;padding:0 14px;font-size:14px;border-radius:10px}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.45}
.chip{display:inline-block;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600;white-space:nowrap}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.water{background:var(--water-soft);color:var(--water)}
nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--bg);padding:6px 0 4px;position:relative;z-index:10}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted);min-height:48px}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected="true"]{color:var(--accent)}
.hero{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.hero .eyebrow{color:inherit;opacity:.8}
.hero h2{font-size:34px}
.hero .btn{background:var(--accent-ink);color:var(--accent)}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent-ink);border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:28px;line-height:1.05}
.stat span{font-size:12px;color:var(--muted)}
.rings3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ringcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.ring{width:62px;height:62px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3.4}
.ring .rbg{stroke:var(--line)}
.ring .rfg{stroke-linecap:round}
.ringcard b{font-family:var(--display);font-size:22px;line-height:1.1;margin-top:2px}
.ringcard span{font-size:11px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{text-align:center;padding:12px 6px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:600}
.badge svg{width:30px;height:30px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto 6px}
.badge.locked{opacity:.45}.badge.locked svg{stroke:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:11px;color:var(--muted)}
.week i{display:block;height:34px;border-radius:9px;background:var(--line);margin-bottom:4px}
.week .on i{background:var(--accent)}
.week .today span{color:var(--ink);font-weight:700}
/* treino */
.rail{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;min-width:58px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:center;display:flex;flex-direction:column;gap:1px;font-weight:700}
.dchip small{font-size:11px;font-weight:500;color:var(--muted)}
.dchip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dchip.active small{color:inherit;opacity:.85}
.dchip i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);margin-left:4px;vertical-align:middle}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ex.done{border-color:var(--accent)}
.ex-top{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 12px;cursor:pointer}
.chk{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;color:transparent}
.chk svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.done>.ex-top .chk,.set-ok.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ex-name{font-weight:700;line-height:1.2}
.ex-meta{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.vlink{color:var(--accent);font-weight:700;text-decoration:none;padding:4px 0;min-height:28px;display:inline-flex;align-items:center}
.ex-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.rest-btn{padding:4px 10px;border-radius:99px;background:var(--amber-soft);color:var(--amber);font-size:12px;font-weight:700;min-height:28px}
.panel{display:none;border-top:1px solid var(--line);padding:10px 12px 14px}
.ex.open .panel{display:block}
.last{font-size:12px;color:var(--muted);margin-bottom:6px}
.hintup{font-size:13px;padding:7px 10px;border-radius:9px;background:var(--accent-soft);color:var(--accent);margin-bottom:8px;font-weight:600}
.sethead,.setrow{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;align-items:center}
.sethead{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;text-align:center}
.setrow{margin-top:8px}
.setrow.simple,.sethead.simple{grid-template-columns:28px 1fr 44px}
.setrow .n{width:28px;height:28px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.setrow.done .n{background:var(--accent);color:var(--accent-ink)}
.setrow input{text-align:center;padding:9px 6px}
.setrow .lbl{font-weight:600;color:var(--muted)}
.set-ok{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;color:transparent}
.set-ok svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.note{padding:10px 12px;border-radius:10px;background:var(--amber-soft);color:var(--amber);font-size:13px}
/* água */
.bottles{display:flex;justify-content:center;gap:22px}
.bottle{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.bottle svg{width:46px;height:104px}
.b-out{fill:none;stroke:var(--water);stroke-width:2.4}
.b-cap{fill:var(--water)}
.b-liq,.b-top{fill:var(--water)}
.b-top{opacity:.55}
.bottle.full small{color:var(--water);font-weight:700}
.wq-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wq{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;min-height:56px}
.wq b{font-family:var(--display);font-size:22px;line-height:1.1;color:var(--water)}
.wq span{font-size:11px;color:var(--muted)}
.wq.full{background:var(--water);border-color:var(--water)}
.wq.full b,.wq.full span{color:var(--bg)}
.wbig{font-family:var(--display);font-size:38px;line-height:1}
/* listas e folhas */
.wk-ex{margin:8px 0 0;padding:0;list-style:none;color:var(--muted);font-size:13px}
.hist{display:flex;justify-content:space-between;gap:10px;align-items:center}
.hist small{color:var(--muted)}
.sheet{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:15}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 10px;border-bottom:1px solid var(--line)}
.sheet .body{flex:1;overflow-y:auto;padding:14px 0 90px;min-height:0}
.fields{display:flex;gap:8px;margin-top:10px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600;flex:1;min-width:0}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0}
textarea{min-height:200px;resize:vertical}
.empty{color:var(--muted);text-align:center;padding:22px 10px}
.hint{font-size:12px;color:var(--muted)}
svg text{fill:var(--muted);font:11px var(--body)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.toggle:first-of-type{border-top:0}
.toggle span{display:flex;flex-direction:column}
.toggle small{color:var(--muted);font-size:12px}
.toggle input{width:50px;height:30px;flex:0 0 auto;appearance:none;-webkit-appearance:none;border-radius:99px;background:var(--line);border:0;padding:0;position:relative;transition:background .15s}
.toggle input::after{content:'';position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle input:checked{background:var(--accent)}
.toggle input:checked::after{transform:translateX(20px)}
/* dieta */
.datenav{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center}
.datenav .mid{text-align:center;font-weight:700;text-transform:capitalize}
.meter{display:flex;flex-direction:column;gap:5px}
.meter .track{position:relative;height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.meter .track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.meter .plan{background:var(--accent-soft)}
.meter .cons{background:var(--accent)}
.meter.over .cons{background:var(--danger)}
.meter.over .plan{background:var(--danger-soft)}
.meter .lab{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.meter .ok{color:var(--accent);font-weight:700}
.meter.over .ok{color:var(--danger)}
.meal .slot{display:flex;justify-content:space-between;gap:8px;align-items:center}
.meal h3{font-size:21px;margin:4px 0 8px;line-height:1.1}
.meal.done{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.meal .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
details{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:600;color:var(--accent);min-height:32px;display:flex;align-items:center}
.ing{list-style:none;margin:8px 0;padding:0;font-size:14px}
.ing li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line)}
.ing li span:last-child{color:var(--muted);text-align:right}
.prep{margin:6px 0 0;font-size:14px}
.tip{margin:8px 0 0;padding:8px 10px;border-radius:9px;background:var(--amber-soft);color:var(--amber);font-size:13px}
.grp{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}
.cart{margin:0;padding:0}
.cart li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);list-style:none}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tips{margin:6px 0 0;padding-left:18px;font-size:14px}
.tips li{margin:5px 0}
/* cronômetro flutuante */
.timer{position:absolute;z-index:30;left:0;right:0;bottom:74px;display:none;pointer-events:none}
.timer.show{display:block}
.tcard{pointer-events:auto;background:var(--ink);color:var(--bg);border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 28px rgba(0,0,0,.3)}
.tname{flex:1;min-width:0}
.tname b{display:block;font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tname span{display:block;font-size:12px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tclock{font-family:var(--display);font-size:34px;line-height:1;font-weight:700}
.tacts{display:flex;gap:5px}
.tacts button{min-width:38px;height:40px;border-radius:12px;background:rgba(127,127,127,.28);font-weight:700;font-size:14px;padding:0 6px}
.tname{flex:1 1 0}
.mini{display:none;position:relative;width:68px;height:68px;align-items:center;justify-content:center}
.mini svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);padding:4px}
.mini circle{fill:none;stroke-width:3}
.mini .mbg{stroke:rgba(0,0,0,.22)}
.mini .mfg{stroke:var(--accent-ink);stroke-linecap:round;stroke-dasharray:97.4;stroke-dashoffset:0}
.mini b{position:relative;font-family:var(--display);font-size:20px;line-height:1}
.timer.min{left:auto;right:12px;bottom:92px;width:68px;height:68px}
.timer.min .tcard{width:68px;height:68px;padding:0;border-radius:50%;background:var(--accent);color:var(--accent-ink);justify-content:center;touch-action:none;cursor:grab}
.timer.min .tname,.timer.min .tclock,.timer.min .tacts{display:none}
.timer.min .mini{display:flex}
.timer.done .tcard{background:var(--accent);color:var(--accent-ink)}
.tfab{display:none;position:absolute;z-index:20;right:12px;bottom:88px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,.25);font-size:10px;font-weight:700}
.tfab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#app.tab-treino:not(.timer-on):not(.sheet-open) .tfab{display:flex}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:86%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.items{list-style:none;margin:10px 0 0;padding:0}
.item{display:grid;grid-template-columns:40px 1fr auto 40px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.item.rm{grid-template-columns:40px 1fr auto 40px 40px}
.chk.sm{width:40px;height:40px;border-radius:10px}
.item.on .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.iname b{display:block;font-size:15px;line-height:1.2}
.iname small{color:var(--muted);font-size:12px}
.qty{min-width:68px;height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.sw{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.pick{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:16px;padding:0 6px;width:100%;min-width:0}
.pk-back{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
.pk{width:100%;background:var(--surface);border-radius:20px 20px 0 0;padding:16px;display:flex;flex-direction:column;gap:6px;max-height:88%}
.pk-title{font-family:var(--display);font-size:22px;text-align:center;line-height:1.1}
.pk-labels{display:grid;gap:6px;text-align:center;font-size:12px;font-weight:600;color:var(--muted);margin-top:6px}
.pk-wheels{position:relative;display:grid;gap:6px;height:220px}
.pk-band{position:absolute;left:0;right:0;top:88px;height:44px;border-radius:10px;background:var(--accent-soft);pointer-events:none}
.wheel{position:relative;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;padding:88px 0;height:220px;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent);mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wheel [role=option]{height:44px;line-height:44px;text-align:center;scroll-snap-align:center;font-size:22px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.wheel [role=option].sel{color:var(--ink)}
.pk-list{overflow-y:auto;min-height:0}
.pk-item{width:100%;display:flex;justify-content:space-between;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);text-align:left;font-weight:600}
.pk-item small{color:var(--muted);font-weight:500;text-align:right}
@media (prefers-reduced-motion:no-preference){
  .btn,.set-ok,.chk,.wq{transition:transform .08s}.btn:active,.set-ok:active,.chk:active,.wq:active{transform:scale(.96)}
  .timer.done .tcard{animation:pulse .7s ease-in-out 4}
  @keyframes pulse{50%{transform:scale(1.04)}}
  .rfg{transition:stroke-dasharray .3s}
}
</style>
</head>
<body>
<div id="app">
  <main id="view" tabindex="-1"></main>
  <nav id="tabs" role="tablist" aria-label="Seções"></nav>

/* alterna A/B a cada semana corrida (mesma regra do app de referência) */
function weekParity(date){
  date = new Date(date);
  var dow = (date.getDay() + 6) % 7;
  var monday = new Date(date.getFullYear(), date.getMonth(), date.getDate() - dow);
  var weekIndex = Math.floor(monday.getTime() / (7*24*3600*1000));
  return (weekIndex % 2 === 0) ? 'A' : 'B';
}

(function(){

/* ---------- estado ---------- */

var curDay=today();

/* ---------- plano, semana A/B, séries ---------- */
function planDay(k){return S.plan.filter(function(d){return d.key===k})[0]}
function keyOfDate(d){var w=dobj(d).getDay();return (S.plan.filter(function(x){return WD[x.key]===w})[0]||S.plan[0]).key}

function exOf(d,week){return d.rest?[]:((week==='B'&&d.exB)?d.exB:d.ex)}
function parseSets(s){var m=/^(\d+)\s*×/.exec(s);return m?parseInt(m[1],10):1}
function repRange(s){var m=/×\s*(\d+)(?:-(\d+))?\s*(s)?/.exec(s);if(!m)return null;return {lo:+m[1],hi:+(m[2]||m[1]),timed:!!m[3]}}

/* carga inicial sugerida: fração do peso corporal para 4×12 em máquina, por exercício.
   É um ponto de partida conservador para iniciante/retorno; o nível (mais leve, padrão, mais pesado) muda o multiplicador. */
var KGR=[[/leg press/i,.9],[/hack squat/i,.6],[/extensora/i,.35],[/flexora/i,.3],[/adutora|abdutora/i,.35],
 [/panturrilha em p/i,.6],[/panturrilha sentada/i,.35],[/pélvica/i,.6],[/glúteo|apolete/i,.3],
 [/supino inclinado/i,.3],[/supino/i,.35],[/peck deck/i,.25],[/cross over/i,.12],[/desenvolvimento/i,.25],
 [/lateral/i,.06],[/frontal/i,.07],[/crucifixo invertido/i,.06],[/tríceps/i,.2],
 [/graviton/i,.4],[/puxada/i,.45],[/remada/i,.4],[/rosca unilateral/i,.1],[/rosca/i,.2],
 [/crunch \(máquina\)|articulado/i,.3],[/polia alta/i,.25],[/rotação/i,.12]];
var LVL=[{n:'Mais leve',m:.75},{n:'Padrão',m:1},{n:'Mais pesado',m:1.3}];

function kgStr(v){return v%1?String(v).replace('.',','):String(v)}
function suggestKg(name){
  for(var i=0;i<KGR.length;i++)if(KGR[i][0].test(name)){
    var v=bodyKg()*KGR[i][1]*(LVL[S.profile.lvl]||LVL[1]).m;
    return v<10?Math.max(1,Math.round(v)):Math.round(v/2.5)*2.5;
  }
  return null;
}
function lastSession(name,date){var e=S.log[name];if(!e)return null;if(e.cur&&e.cur.date!==date)return e.cur;return e.prev||null}
function logSets(name,sets,date){
  var e=S.log[name]||{};
  if(e.cur&&e.cur.date!==date)e.prev=e.cur;
  e.cur={date:date,sets:sets.map(function(s){return {done:!!s.done,kg:s.kg,reps:s.reps}})};
  S.log[name]=e;
}
function newSetsFor(ex,date){
  var n=parseSets(ex.s),last=lastSession(ex.n,date),a=[];
  var sg=suggestKg(ex.n),rr=repRange(ex.s),mode=exMode(ex);
  for(var i=0;i<n;i++){var p=last&&last.sets&&(last.sets[i]||last.sets[last.sets.length-1]);
    a.push({done:false,kg:p&&p.kg!=null?p.kg:(mode==='load'&&sg!=null?kgStr(sg):''),reps:p&&p.reps!=null?p.reps:(mode==='load'&&rr?String(rr.lo):'')})}
  return a;
}
function wState(date,key){
  var r=rec(date,true),d=planDay(key),list=exOf(d,weekOf(date)),st=r.w[key],names=list.map(function(e){return e.n});
  if(!st||st.names.join('|')!==names.join('|')){
    var old=st;
    st={names:names,sets:list.map(function(ex,i){
      var arr=newSetsFor(ex,date);
      if(old){var oi=old.names.indexOf(ex.n);if(oi>=0&&old.sets[oi].length===arr.length)arr=old.sets[oi]}
      return arr})};
    r.w[key]=st;
  }
  /* séries ainda vazias recebem a carga sugerida e as repetições do plano */
  list.forEach(function(ex,i){
    if(exMode(ex)!=='load'||!st.sets[i])return;
    var sg=suggestKg(ex.n),rr=repRange(ex.s);
    st.sets[i].forEach(function(s){
      if(s.done)return;
      if((s.kg===''||s.kg==null)&&sg!=null)s.kg=kgStr(sg);
      if((s.reps===''||s.reps==null)&&rr)s.reps=String(rr.lo);
    });
  });
  return st;
}
function keyStats(st){
  var done=0,total=0,vol=0,exDone=0;
  st.sets.forEach(function(arr){var all=arr.length>0;arr.forEach(function(s){total++;if(s.done)  {done++;vol+=num(s.kg)*num(s.reps)}else all=false});if(all)exDone++});
  return {setsDone:done,setsTotal:total,volume:Math.round(vol),exDone:exDone,exTotal:st.sets.length};
}
function activeKeys(date){
  var r=rec(date),keys=[];

  if(!keys.length){var k=keyOfDate(date);if(!planDay(k).rest)keys=[k]}
  return keys;
}

  var t={setsDone:0,setsTotal:0,volume:0,exDone:0,exTotal:0,keys:activeKeys(date)};
  var r=rec(date);
  t.keys.forEach(function(k){
    var st=(r&&r.w[k])||null;
    if(!st){var ex=exOf(planDay(k),weekOf(date));ex.forEach(function(e){t.setsTotal+=parseSets(e.s);t.exTotal++});return}
    var s=keyStats(st);for(var x in s)t[x]+=s[x];
  });
  return t;
}
function trained(date){var s=dateStats(date);return s.setsDone>0&&s.setsDone>=Math.ceil(s.setsTotal/2)}

}

}

  var list=RECIPES[slot],n=list.length,dn=dnum(d),wk=Math.floor(dn/7);

}
function rd(g){return g<10?Math.round(g*10)/10:Math.round(g)}
function mkEnt(r,sc){return r.ing.map(function(i){var g=rd(i[1]*sc);return {k:i[0],g:g,g0:g,c:i[2],e:0}})}
/* a refeição é uma lista de itens com quantidade: a receita do dia é só a sugestão inicial */
function mealOf(d,slot,si){
  var st=dayState(d),m=st&&st.meal&&st.meal[slot];
  if(m&&RB[m.rid])return m;
  var old=st&&st.done&&st.done[slot];            // compatível com a versão anterior (refeição inteira)
  var r=old&&RB[old.id]?RB[old.id]:pick(slot,si,d),sc=old?old.sc:S.diet.sc;
  var v={rid:r.id,ent:mkEnt(r,sc),virt:1};
  if(old)v.ent.forEach(function(x){x.e=1});
  return v;
}
function mealW(d,slot,si){
  var st=dayState(d,true),m=st.meal[slot];
  if(!m||!RB[m.rid]){m=mealOf(d,slot,si);delete m.virt;st.meal[slot]=m;delete st.done[slot]}
  return m;
}
function slotIdx(slot){return SLOTS.map(function(s){return s[0]}).indexOf(slot)}
function entNut(list,onlyEaten){
  var t={kcal:0,p:0,f:0,k:0,na:0};
  list.forEach(function(x){
    if(onlyEaten&&!x.e)return;
    var f=F[x.k],m=x.g/100;t.kcal+=f[2]*m;t.p+=f[3]*m;t.f+=f[4]*m;t.k+=f[5]*m;t.na+=f[6]*m;
  });
  return t;
}
function dayMenu(d){
  return SLOTS.map(function(s,i){
    var m=mealOf(d,s[0],i),eaten=m.ent.filter(function(x){return x.e}).length;
    return {slot:s[0],si:i,label:s[1],r:RB[m.rid],ent:m.ent,plan:entNut(m.ent,false),n:entNut(m.ent,true),
      eaten:eaten,done:eaten>0&&eaten===m.ent.length,started:eaten>0};
  });
}
function dayTotals(d){
  var plan={kcal:0,p:0,f:0,k:0,na:0},cons={kcal:0,p:0,f:0,k:0,na:0};
  dayMenu(d).forEach(function(m){for(var k in plan){plan[k]+=m.plan[k];cons[k]+=m.n[k]}});
  return {plan:plan,cons:cons};
}
function mealsDone(d){return dayMenu(d).filter(function(m){return m.started}).length}
/* substituições: mesmo grupo de alimentos, com quantidade equivalente em calorias, proteína ou volume */
var SG=[{m:'prot',k:['frango','tilapia','salmao','patinho','ovo','tofu']},
 {m:'kcal',k:['arrozint','quinoa','batatadoce','batata','mandioca','macint','milho']},
 {m:'kcal',k:['feijaopreto','feijaocarioca','lentilha','graodebico','ervilha']},
 {m:'kcal',k:['banana','mamao','laranja','kiwi','morango','goiaba','sucolaranja']},
 {m:'same',k:['rucula','alface','espinafre','couve','brocolis','couveflor','abobrinha','berinjela','tomate','pimentao','cenoura','cenouracrua','abobora','beterraba']},
 {m:'kcal',k:['iogurte','leite']},
 {m:'kcal',k:['amendoa','castanhapara','caju','aboborasem','chia','linhaca','pastaamendoim']},
 {m:'kcal',k:['azeite','abacate']},
 {m:'kcal',k:['paoint','aveia']}];
function altsFor(k,g){
  var grp=SG.filter(function(x){return x.k.indexOf(k)>=0})[0];
  if(!grp)return [];
  return grp.k.filter(function(o){return o!==k}).map(function(o){
    var v=grp.m==='prot'?g*F[k][3]/F[o][3]:grp.m==='kcal'?g*F[k][2]/F[o][2]:g;
    v=v<30?Math.max(1,Math.round(v)):Math.min(1000,Math.round(v/5)*5);
    return {k:o,g:v};
  });
}
var DEFG={'Frutas':100,'Legumes e verduras':100,'Grãos e leguminosas':100,'Carnes, peixes e ovos':100,'Laticínios':150,'Sementes e oleaginosas':20,'Temperos e outros':5};
function fq(g){return (g<10?f1(g):fmt(g))+' g'}
function meter(nome,unit,cons,plan,target,limit,dec){
  var pc=function(v){return Math.min(100,v/target*100)};
  var over=limit&&cons>target;
  var nf=function(v){return dec?f1(v):fmt(v)};
  var status=limit?(over?'acima do limite':(cons>0?'dentro do limite':'')):(cons>=target?'meta atingida':'');
  return '<div class="meter'+(over?' over':'')+'"><div class="lab"><b>'+nome+'</b><span class="num">'+nf(cons)+' / '+nf(target)+' '+unit+'</span></div>'+
    '<div class="track" role="img" aria-label="'+nome+': '+nf(cons)+' de '+nf(target)+' '+unit+'"><i class="plan" style="width:'+pc(plan)+'%"></i><i class="cons" style="width:'+pc(cons)+'%"></i></div>'+
    '<div class="lab hint"><span>Cardápio do dia: <span class="num">'+nf(plan)+'</span> '+unit+(limit?' (≈ '+f1(plan*2.5/1000)+' g de sal)':'')+'</span><span class="ok">'+status+'</span></div></div>';
}

/* ---------- métricas ---------- */
function streak(){
  var n=0,i=trained(today())?0:1;
  for(;i<400;i++){
    var d=daysAgo(i);
    if(dobj(d).getDay()===0)continue;
    if(trained(d))n++;else break;
  }
  return n;
}
function trainedDays(){return Object.keys(S.days).filter(trained).length}
function totalVol(){var v=0;Object.keys(S.days).forEach(function(d){v+=dateStats(d).volume});return v}
function waterGoalDays(){return Object.keys(S.days).filter(function(d){return waterOf(d)>=S.set.waterGoal}).length}
var BADGES=[
 {k:'Primeiro treino',i:'bolt',ok:function(){return trainedDays()>=1}},
 {k:'10 treinos',i:'dumb',ok:function(){return trainedDays()>=10}},
 {k:'3 dias seguidos',i:'flame',ok:function(){return streak()>=3}},
 {k:'Semana completa',i:'star',ok:function(){return streak()>=6}},
 {k:'Meta de água 7×',i:'drop',ok:function(){return waterGoalDays()>=7}},
 {k:'10 toneladas',i:'weight',ok:function(){return totalVol()>=10000}}
];
function weekRows(){

}

function chart(){
  var w=S.weights.slice().sort(function(a,b){return a.d<b.d?-1:1});
  if(w.length<2)return '<div class="empty">Registre ao menos dois pesos para ver o gráfico.</div>';
  var W=340,H=170,L=34,R=10,T=18,B=26;
  var vals=w.map(function(x){return x.kg}),mn=Math.floor(Math.min.apply(0,vals)-1),mx=Math.ceil(Math.max.apply(0,vals)+1);
  var t0=dnum(w[0].d),t1=dnum(w[w.length-1].d);
  function X(d){return L+(dnum(d)-t0)/Math.max(1,t1-t0)*(W-L-R)}
  function Y(v){return T+(mx-v)/(mx-mn)*(H-T-B)}
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Evolução do peso">';
  for(var k=0;k<=3;k++){var v=mn+(mx-mn)*k/3;s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+v.toFixed(0)+'</text>'}
  s+='<polyline points="'+w.map(function(x){return X(x.d).toFixed(1)+','+Y(x.kg).toFixed(1)}).join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>';
  w.forEach(function(x,i){s+='<circle cx="'+X(x.d)+'" cy="'+Y(x.kg)+'" r="'+(i===w.length-1?5:3)+'" fill="var(--accent)"/>'});
  s+='<text x="'+L+'" y="'+(H-6)+'">'+dfmt(w[0].d)+'</text><text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+dfmt(w[w.length-1].d)+'</text>';
  var last=w[w.length-1];
  s+='<text x="'+Math.min(X(last.d),W-R-30)+'" y="'+(Y(last.kg)-9)+'" style="fill:var(--ink);font-weight:700">'+String(last.kg).replace('.',',')+' kg</text></svg>';
  return s;
}

    if(d.moved){S.set.fab={x:d.x,y:d.y};saveQuiet()}
    else{T.min=false;tui();tsave()}
    d=null;
  }
  tw.addEventListener('pointerup',end);tw.addEventListener('pointercancel',function(){d=null});
})();

/* ---------- planilha Google (Apps Script) ---------- */
function sheetReady(){return !!(S.sheet.url&&S.sheet.key)}
function setSheetStatus(st,msg){
  sheetState=st;sheetMsg=msg||'';
  var a=$('#sheetState'),b=$('#sheetMsg');if(a)a.textContent=st;if(b)b.textContent=sheetMsg;
}
function scheduleSheet(delay){
  if(!sheetReady())return;
  clearTimeout(sheetTimer);sheetTimer=setTimeout(function(){syncSheet(false)},delay==null?4000:delay);
}
function payload(){
  var from=daysAgo(13),dates=[];
  Object.keys(S.days).forEach(function(d){
    if(d<from)return;
    if(dateStats(d).setsDone>0||waterOf(d)>0||mealsDone(d)>0)dates.push(d);
  });
  Object.keys(S.diet.days).forEach(function(d){if(d>=from&&dates.indexOf(d)<0&&mealsDone(d)>0)dates.push(d)});
  dates.sort();
  var days=dates.map(function(d){
    var s=dateStats(d),t=dayTotals(d),r=rec(d),series=[],names=[];
    s.keys.forEach(function(k){
      var st=r&&r.w[k];if(!st)return;
      names.push(planDay(k).name+' · '+planDay(k).focus);
      st.names.forEach(function(n,i){st.sets[i].forEach(function(x,j){if(x.done)series.push({ex:n,n:j+1,kg:num(x.kg),reps:num(x.reps)})})});
    });
    var menu=dayMenu(d).filter(function(m){return m.started}).map(function(m){return m.label+': '+m.ent.filter(function(x){return x.e}).map(function(x){return F[x.k][0]+' '+Math.round(x.g)+' g'}).join(', ')});
    return {date:d,treino:names.join(' | '),semana:weekOf(d),exDone:s.exDone,exTotal:s.exTotal,setsDone:s.setsDone,setsTotal:s.setsTotal,volume:s.volume,
      aguaMl:waterOf(d),aguaMeta:S.set.waterGoal,refeicoes:menu.join(' | '),kcal:Math.round(t.cons.kcal),potassio:Math.round(t.cons.k),
      fibra:Math.round(t.cons.f*10)/10,sodio:Math.round(t.cons.na),series:series};
  });
  var wm={};S.weights.forEach(function(w){if(w.d>=from)wm[w.d]=w.kg});
  return {token:S.sheet.key,days:days,weights:wm};
}
async function syncSheet(manual){
  if(!sheetReady()){if(manual)setSheetStatus('desligada','Preencha o endereço e a chave e toque em Salvar.');return}
  if(sheetBusy){scheduleSheet();return}
  sheetBusy=true;setSheetStatus('enviando…',manual?'Enviando para a planilha…':'');
  var body=JSON.stringify(payload()),stamp=function(){return new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})};
  try{
    var res=await fetch(S.sheet.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body,redirect:'follow'});
    var out=await res.json();
    if(out&&out.ok){S.sheet.last=stamp();saveQuiet();setSheetStatus('ligada ✓','Última sincronização: '+S.sheet.last+' ('+out.dias+' dias, '+(out.series||0)+' séries)')}
    else setSheetStatus('erro','A planilha recusou: '+((out&&out.error)||'resposta inesperada')+'.');
  }catch(e){
    try{
      await fetch(S.sheet.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body});
      setSheetStatus('enviado','Enviado, sem confirmação de recebimento. Confira na planilha.');
    }catch(e2){setSheetStatus('sem conexão','Não consegui enviar agora. Tento de novo na próxima alteração.')}
  }
  sheetBusy=false;
}

/* ---------- atualização diária ---------- */
var reloadPending=false;
function checkDay(){
  var t=today();
  if(t===curDay)return;
  var prev=curDay,wasToday=dDate===prev,wasKey=activeKey===keyOfDate(prev);
  curDay=t;if(wasToday)dDate=t;if(wasKey)activeKey=keyOfDate(t);
  releaseWake();openEx={};
  render();
  scheduleSheet(500);
  toast('Novo dia: '+dobj(t).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'short'}));
}
function maybeReload(){if(reloadPending&&!T.active&&!editing&&document.visibilityState==='visible'){reloadPending=false;location.reload()}}
setInterval(function(){checkDay();maybeReload()},15000);
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'){
    notifCancel();
    checkDay();
    if(T.running)ttick();
    if(wakeWanted)acquireWake();
    try{if(navigator.serviceWorker)navigator.serviceWorker.getRegistration().then(function(r){if(r)r.update()})}catch(e){}
    if(tab==='hoje')render();
  }else{
    if(T.running)notifSchedule();
    tsave();
  }
});

/* ---------- seletor de rodinha (como nos apps do iPhone) ---------- */
var IH=44,GV=[];
(function(){var g;for(g=0;g<=30;g++)GV.push(g);for(g=35;g<=1000;g+=5)GV.push(g)})();
function gIdx(g){var b=0;GV.forEach(function(v,i){if(Math.abs(v-g)<Math.abs(GV[b]-g))b=i});return b}
function hapticSel(){var H=plug('Haptics');try{if(H)H.selectionChanged()}catch(e){}}
function closeSheet(){
  var b=$('#pkBack');if(!b)return;b.remove();
  var H=plug('Haptics');try{if(H)H.selectionEnd()}catch(e){}
}
function openWheel(o,cb){
  closeSheet();
  var H=plug('Haptics');try{if(H)H.selectionStart()}catch(e){}
  var tpl=o.cols.map(function(c){return (c.w||1)+'fr'}).join(' ');
  var back=document.createElement('div');back.id='pkBack';back.className='pk-back';
  back.innerHTML='<div class="pk" role="dialog" aria-label="'+esc(o.title)+'"><div class="pk-title">'+esc(o.title)+'</div>'+
   (o.hint?'<div class="hint" style="text-align:center">'+esc(o.hint)+'</div>':'')+
   '<div class="pk-labels" style="grid-template-columns:'+tpl+'">'+o.cols.map(function(c){return '<span>'+esc(c.label||'')+'</span>'}).join('')+'</div>'+
   '<div class="pk-wheels" style="grid-template-columns:'+tpl+'"><div class="pk-band"></div>'+
   o.cols.map(function(c,ci){return '<div class="wheel" role="listbox" aria-label="'+esc(c.label||'valor')+'">'+
     c.items.map(function(t,i){return '<div role="option" class="'+(i===c.sel?'sel':'')+'">'+esc(t)+'</div>'}).join('')+'</div>'}).join('')+'</div>'+
   (o.all?'<label class="toggle" style="border-top:0"><span>'+esc(o.all.label)+'</span><input type="checkbox" id="pkAll"'+(o.all.on?' checked':'')+'></label>':'')+
   '<div class="row" style="margin-top:6px"><button class="btn ghost" data-pkx style="flex:1">Cancelar</button><button class="btn" data-pkok style="flex:1">OK</button></div></div>';
  $('#app').appendChild(back);
  var wheels=[].slice.call(back.querySelectorAll('.wheel'));
  wheels.forEach(function(w,ci){
    var n=o.cols[ci].items.length;w._i=o.cols[ci].sel;w.scrollTop=w._i*IH;
    var raf=0;
    w.addEventListener('scroll',function(){
      if(raf)return;
      raf=requestAnimationFrame(function(){
        raf=0;var i=Math.max(0,Math.min(n-1,Math.round(w.scrollTop/IH)));
        if(i!==w._i){w._i=i;[].forEach.call(w.children,function(c,k){c.classList.toggle('sel',k===i)});hapticSel()}
      });
    });
    w.addEventListener('click',function(e){var c=e.target.closest('[role=option]');if(!c)return;w.scrollTo({top:[].indexOf.call(w.children,c)*IH,behavior:'smooth'})});
  });
  back.addEventListener('click',function(e){
    if(e.target===back||e.target.closest('[data-pkx]')){closeSheet();return}
    if(e.target.closest('[data-pkok]')){
      var idx=wheels.map(function(w){return w._i}),all=$('#pkAll')?$('#pkAll').checked:false;
      closeSheet();cb(idx,all);
    }
  });
}
function openList(o,cb){
  closeSheet();
  var back=document.createElement('div');back.id='pkBack';back.className='pk-back';
  back.innerHTML='<div class="pk" role="dialog" aria-label="'+esc(o.title)+'"><div class="pk-title">'+esc(o.title)+'</div>'+
   (o.hint?'<div class="hint" style="text-align:center">'+esc(o.hint)+'</div>':'')+
   '<div class="pk-list">'+o.items.map(function(it,i){
     return (it.group?'<div class="grp">'+esc(it.group)+'</div>':'')+'<button class="pk-item" data-pi="'+i+'"><span>'+esc(it.label)+'</span><small class="num">'+esc(it.detail||'')+'</small></button>';
   }).join('')+'</div><button class="btn ghost" data-pkx style="margin-top:8px">Cancelar</button></div>';
  $('#app').appendChild(back);
  back.addEventListener('click',function(e){
    if(e.target===back||e.target.closest('[data-pkx]')){closeSheet();return}
    var b=e.target.closest('[data-pi]');if(b){var it=o.items[+b.dataset.pi];closeSheet();cb(it)}
  });
}

/* ---------- eventos ---------- */
function commitEx(st,key,i){
  var d=planDay(key),list=exOf(d,weekOf(curDay)),ex=list[i];
  if(ex&&exMode(ex)==='load')logSets(ex.n,st.sets[i],curDay);
  save();
}
document.addEventListener('click',function(ev){
  if(ev.target.closest('a.vlink'))return;   // o link do vídeo abre sozinho, sem abrir/fechar o cartão
  var t=ev.target.closest('button,[data-toggle]');if(!t)return;
  if(t.dataset.tt){tcmd(t.dataset.tt);return}
  if(t.dataset.tab){tab=t.dataset.tab;$('#view').scrollTop=0;render();return}
  if(t.dataset.open){activeKey=t.dataset.open;tab='treino';$('#view').scrollTop=0;render();return}
  if(t.dataset.day){activeKey=t.dataset.day;render();return}
  /* treino */
  if(t.dataset.toggle!==undefined&&!ev.target.closest('button')){
    var k=activeKey+':'+t.dataset.toggle;openEx[k]=!openEx[k];render();return}
  if(t.dataset.all!==undefined){
    var i=+t.dataset.all,st=wState(curDay,activeKey),val=!st.sets[i].every(function(s){return s.done});
    st.sets[i].forEach(function(s){s.done=val});
    commitEx(st,activeKey,i);if(val)acquireWake();hapticTap();render();return}
  if(t.dataset.rest!==undefined){
    var ex=exOf(planDay(activeKey),weekOf(curDay))[+t.dataset.rest];tstart(ex.n,ex.r);return}
  if(t.dataset.ok){
    var p=t.dataset.ok.split(','),i2=+p[0],j=+p[1],st2=wState(curDay,activeKey),arr=st2.sets[i2],s=arr[j];
    var ex2=exOf(planDay(activeKey),weekOf(curDay))[i2];
    if(!s.done&&exMode(ex2)==='load'&&j>0){var pv=arr[j-1];if(s.kg===''&&pv.kg!=='')s.kg=pv.kg;if(s.reps===''&&pv.reps!=='')s.reps=pv.reps}
    s.done=!s.done;
    commitEx(st2,activeKey,i2);
    if(s.done){acquireWake();hapticTap();if(S.set.autoRest&&ex2.r>0)tstart(ex2.n,ex2.r)}
    openEx[activeKey+':'+i2]=true;render();return}
  if(t.dataset.pick){
    var pp=t.dataset.pick.split(','),ip=+pp[0],jp=+pp[1],stp=wState(curDay,activeKey),arrp=stp.sets[ip],sp=arrp[jp],exp=exOf(planDay(activeKey),weekOf(curDay))[ip];
    var kv=num(sp.kg),wh=Math.min(300,Math.floor(kv)),dc=Math.round((kv-wh)*4);if(dc>3){wh=Math.min(300,wh+1);dc=0}
    var rp0=Math.min(100,Math.max(1,Math.round(num(sp.reps))||12)),sgp=suggestKg(exp.n),llp=lastLine(exp.n,curDay);
    var ints=[],rps=[],q;for(q=0;q<=300;q++)ints.push(String(q));for(q=1;q<=100;q++)rps.push(String(q));
    openWheel({title:exp.n+' · Série '+(jp+1),hint:llp?'Última vez: '+llp.text:(sgp!=null?'Sugestão inicial: '+kgStr(sgp)+' kg':''),
      cols:[{label:'kg',items:ints,sel:wh,w:1.2},{label:'',items:[',00',',25',',50',',75'],sel:dc,w:.9},{label:'repetições',items:rps,sel:rp0-1,w:1.1}],
      all:{label:'Aplicar às séries ainda não feitas',on:!arrp.some(function(x){return x.done})}},
      function(ix,all){
        var dd=['','25','5','75'][ix[1]],kg=dd?ix[0]+','+dd:String(ix[0]),reps=String(ix[2]+1);
        (all?arrp.filter(function(x){return !x.done||x===sp}):[sp]).forEach(function(x){x.kg=kg;x.reps=reps});
        if(sp.done)commitEx(stp,activeKey,ip);else save();
        render();
      });return}
  if(t.hasAttribute('data-resug')){
    var rr0=rec(curDay);
    if(rr0)Object.keys(rr0.w).forEach(function(k){
      var l2=exOf(planDay(k),weekOf(curDay));
      rr0.w[k].sets.forEach(function(arr2,i2){
        var sg2=l2[i2]&&suggestKg(l2[i2].n);
        if(sg2!=null)arr2.forEach(function(x){if(!x.done)x.kg=kgStr(sg2)});
      });
    });
    save();toast('Cargas sugeridas reaplicadas hoje');render();return}
  if(t.hasAttribute('data-editplan')){editing=activeKey;render();return}
  if(t.hasAttribute('data-cancel')){editing=null;render();return}
  if(t.hasAttribute('data-resetplan')){
    if(t.dataset.armed){S.plan=JSON.parse(JSON.stringify(DAYS));S.planV=PLAN_V;S.planCustom=false;save();toast('Plano original restaurado');render()}
    else{t.dataset.armed=1;t.textContent='Confirmar restauração';setTimeout(function(){if(t.isConnected){delete t.dataset.armed;t.textContent='Restaurar plano original'}},3000)}
    return}
  if(t.hasAttribute('data-testalert')){alertDone();toast('Alerta de teste disparado');return}
  /* água */
  if(t.dataset.water){addWater(+t.dataset.water);return}
  if(t.hasAttribute('data-wundo')){
    var r=rec(curDay);if(r&&r.wlog&&r.wlog.length){var l=r.wlog.pop();r.water=Math.max(0,r.water-l);save();render()}return}
  /* dieta */
  if(t.dataset.dd!==undefined){dDate=t.dataset.dd==='0'?today():addDays(dDate,+t.dataset.dd);render();return}
  if(t.dataset.eat){
    var pe=t.dataset.eat.split(','),me=mealW(dDate,pe[0],slotIdx(pe[0])),xe=me.ent[+pe[1]];
    xe.e=xe.e?0:1;save();hapticTap();render();return}
  if(t.dataset.eatall){
    var ma=mealW(dDate,t.dataset.eatall,slotIdx(t.dataset.eatall)),all0=ma.ent.every(function(x){return x.e});
    ma.ent.forEach(function(x){x.e=all0?0:1});save();hapticTap();render();return}
  if(t.dataset.qty){
    var pq=t.dataset.qty.split(','),mq=mealW(dDate,pq[0],slotIdx(pq[0])),xq=mq.ent[+pq[1]];
    openWheel({title:F[xq.k][0],hint:'Quantidade em gramas',cols:[{label:'gramas',items:GV.map(String),sel:gIdx(xq.g)}]},
      function(ix){xq.g=GV[ix[0]];delete xq.c;save();render()});return}
  if(t.dataset.sub){
    var ps=t.dataset.sub.split(','),ms=mealW(dDate,ps[0],slotIdx(ps[0])),xs=ms.ent[+ps[1]],al=altsFor(xs.k,xs.g);
    openList({title:'Trocar '+F[xs.k][0],hint:'Quantidades equivalentes a '+fq(xs.g)+' do item atual',
      items:al.map(function(a){return {label:F[a.k][0],detail:fq(a.g)+' · '+fmt(F[a.k][2]*a.g/100)+' kcal',val:a}})},
      function(it){xs.k=it.val.k;xs.g=it.val.g;xs.g0=xs.g;delete xs.c;save();render()});return}
  if(t.dataset.add){
    var sa=t.dataset.add,last='',items=Object.keys(F).filter(function(k){return k!=='sal'}).sort(function(a,b){return F[a][1]===F[b][1]?F[a][0].localeCompare(F[b][0]):F[a][1].localeCompare(F[b][1])}).map(function(k){
      var it={label:F[k][0],detail:fmt(F[k][2])+' kcal/100 g',val:k};if(F[k][1]!==last){it.group=F[k][1];last=F[k][1]}return it});
    openList({title:'Adicionar alimento',hint:'Depois toque na quantidade para ajustar',items:items},function(it){
      var mm=mealW(dDate,sa,slotIdx(sa));mm.ent.push({k:it.val,g:DEFG[F[it.val][1]]||100,g0:0,e:0,x:1});save();render()});return}
  if(t.dataset.rm){
    var pr=t.dataset.rm.split(','),mr=mealW(dDate,pr[0],slotIdx(pr[0]));mr.ent.splice(+pr[1],1);save();render();return}
  if(t.dataset.swap){
    var sl=t.dataset.swap,s3=dayState(dDate,true);
    s3.swap[sl]=(s3.swap[sl]||0)+1;delete s3.meal[sl];delete s3.done[sl];
    delete openRec[dDate+sl];save();render();return}
  if(t.hasAttribute('data-groc')){groc=true;render();return}
  if(t.hasAttribute('data-closegroc')){groc=false;render();return}
  /* planilha */
  if(t.hasAttribute('data-sheetsave')||t.hasAttribute('data-sheetnow')){
    S.sheet.url=$('#sheetUrl').value.trim();S.sheet.key=$('#sheetKey').value.trim();saveQuiet();
    if(t.hasAttribute('data-sheetnow'))syncSheet(true);
    else if(sheetReady())setSheetStatus('salva','Configuração salva. Toque em "Enviar agora" para testar.');
    else setSheetStatus('desligada','Campos vazios: sincronização desligada.');
    return}
});
function addWater(ml){
  var r=rec(curDay,true);ml=Math.round(ml);if(!(ml>0))return;
  ml=Math.min(ml,6000-r.water);if(ml<=0)return;
  r.water+=ml;r.wlog.push(ml);save();hapticTap();render();
  if(r.water>=S.set.waterGoal&&r.water-ml<S.set.waterGoal)toast('Meta de água batida');
}
document.addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.toggle!==undefined){e.preventDefault();var k=activeKey+':'+e.target.dataset.toggle;openEx[k]=!openEx[k];render()}
});
document.addEventListener('toggle',function(ev){var d=ev.target;if(d.tagName==='DETAILS'&&d.dataset.rid)openRec[d.dataset.rid]=d.open},true);
document.addEventListener('change',function(ev){
  var t=ev.target,D=S.diet;
  if(t.id==='p_h'){var hv=num(t.value);if(hv>=1&&hv<=2.5)S.profile.h=hv;save();render();return}
  if(t.id==='p_lvl'){S.profile.lvl=+t.value;save();render();return}
  if(t.id==='tk'||t.id==='tf'||t.id==='tna'||t.id==='tsc'){
    var v=parseFloat(t.value);
    if(t.id==='tk')D.t.k=Math.min(8000,Math.max(500,v||3500));
    if(t.id==='tf')D.t.f=Math.min(80,Math.max(10,v||30));
    if(t.id==='tna')D.t.na=Math.min(5000,Math.max(500,v||2000));
    if(t.id==='tsc')D.sc=v||1;
    save();render();return}
  if(t.id&&t.id.indexOf('s_')===0){
    var k=t.id.slice(2);
    if(k==='waterGoal')S.set.waterGoal=Math.min(8000,Math.max(500,parseInt(t.value)||3000));
    else{S.set[k]=t.checked;if(k==='notify'&&t.checked)notifPerm();if(k==='sound'&&t.checked){unlockAudio();tone(0,0.15,880,0.3)}if(k==='wake'&&!t.checked)releaseWake()}
    save();if(k==='waterGoal')render();
  }
});
document.addEventListener('submit',function(ev){
  ev.preventDefault();
  var f=ev.target;
  if(f.id==='wtform'){var v=parseInt($('#wtml').value,10);if(v>0&&v<=2000)addWater(v);return}
  if(f.id==='wform'){
    var kg=num($('#wkg').value),d=$('#wdate').value;
    if(!(kg>0)||!d)return;
    S.weights=S.weights.filter(function(x){return x.d!==d});
    S.weights.push({d:d,kg:Math.round(kg*10)/10});save();render();return}
  if(f.id==='eform'){
    var d2=planDay(editing),week=weekOf(curDay);
    var list=$('#eex').value.split('\n').map(function(l){return l.trim()}).filter(Boolean).map(function(l){
      var p=l.split(';').map(function(x){return x.trim()});
      return {n:p[0],s:(p[1]||'3×10').replace(/(\d)\s*x\s*(\d)/i,'$1×$2'),r:parseInt(p[2])||0};
    });
    if(!list.length)return;
    if(week==='B'&&d2.exB)d2.exB=list;else d2.ex=list;
    S.planCustom=true;
    save();editing=null;toast('Treino salvo');render();
  }
});
